<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>101matras — план продаж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116; --panel:#161B22; --panel-2:#1C232C; --line:#2A333F;
    --ink:#E8EDF3; --muted:#7D8894;
    --amber:#F2B138; --good:#35C08E; --bad:#E5484D; --cool:#5AA9E6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    padding:18px 16px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto}

  /* --- шапка --- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .brand{font-family:Oswald,sans-serif;font-weight:600;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
  .brand span{color:var(--amber)}
  .nav{display:flex;align-items:center;gap:8px}
  .nav button{
    background:var(--panel);border:1px solid var(--line);color:var(--ink);
    width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer;line-height:1;
  }
  .nav button:hover{border-color:var(--amber);color:var(--amber)}
  .nav button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .month{font-family:Oswald,sans-serif;font-size:19px;letter-spacing:.08em;text-transform:uppercase;min-width:150px;text-align:center}
  .status{font-size:12px;color:var(--muted)}

  /* --- темп месяца (главный блок) --- */
  .pace{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
  .pace-top{display:flex;flex-wrap:wrap;gap:26px;align-items:baseline;margin-bottom:18px}
  .metric .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
  .metric .val{font-family:Oswald,sans-serif;font-size:34px;line-height:1}
  .metric.big .val{font-size:46px}
  .val.good{color:var(--good)} .val.bad{color:var(--bad)} .val.amber{color:var(--amber)}

  .bar{position:relative;height:26px;background:var(--panel-2);border-radius:6px;overflow:visible}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#C98A16,var(--amber));transition:width .6s ease}
  .marker{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--ink)}
  .marker::after{
    content:attr(data-lbl);position:absolute;left:50%;transform:translateX(-50%);
    top:-19px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap
  }
  .pace-note{margin-top:16px;font-size:13px;color:var(--muted)}
  .pace-note b{color:var(--ink);font-weight:600}

  /* --- сетка точек --- */
  h2{font-family:Oswald,sans-serif;font-weight:500;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card .name{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pct{font-family:Oswald,sans-serif;font-size:20px}
  .nums{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:8px}
  .nums b{color:var(--ink);font-weight:600}
  .mini{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
  .mini i{display:block;height:100%;border-radius:3px}

  /* --- графики --- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .ax{stroke:var(--line);stroke-width:1}
  .gl{stroke:#212A34;stroke-width:1}
  .tick{fill:var(--muted);font-size:10px;font-family:Inter,sans-serif}
  .missing{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.6}
  .missing b{color:var(--bad);font-weight:600}
  .err{background:#2A1416;border:1px solid var(--bad);color:#FFC9CB;padding:14px 16px;border-radius:12px;font-size:13px;line-height:1.6}
  .err code{color:var(--amber)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">101<span>matras</span> · план продаж</div>
      <div class="status" id="status">Загрузка…</div>
    </div>
    <div class="nav">
      <button id="prev" title="Предыдущий месяц" aria-label="Предыдущий месяц">‹</button>
      <div class="month" id="month">—</div>
      <button id="next" title="Следующий месяц" aria-label="Следующий месяц">›</button>
      <button id="reload" title="Обновить" aria-label="Обновить">⟳</button>
    </div>
  </header>

  <div id="app"></div>
</div>

<script>
/* ================== НАСТРОЙКИ ================== */
const SHEET_ID = "1jBYtZlilfh3cDq1Tsm5z4_234c-bLPxMn4vcNfbv8qY";
const REFRESH_MS = 60000;
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
// Запасные названия точек — по порядку колонок. Используются, если строка «ТОчки»
// не попала в ответ Google. Порядок должен совпадать с порядком колонок в таблице.
const STORE_NAMES = ["Маршал","Мебель Люботин","Феромон","Интернет-магазин","Ивано-Франковск","Львов","Инстаграмм","Универмаг"];

let offset = 0;              // 0 = текущий месяц, -1 = прошлый
let timer = null;

/* ================== УТИЛИТЫ ================== */
const fmt = n => (n||0).toLocaleString("ru-RU").replace(/,/g," ");
const pctColor = p => p >= 100 ? "var(--good)" : p >= 80 ? "var(--amber)" : "var(--bad)";

function num(v){
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "number") return v;
  const s = String(v).replace(/\u00a0|\s/g,"").replace(",",".").replace("%","");
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
const txt = v => (v === null || v === undefined) ? "" : String(v).trim();

function sheetName(off){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + off);
  return { name: MONTHS[d.getMonth()] + String(d.getFullYear()).slice(2), date: d };
}

/* ================== ЗАГРУЗКА (JSONP) ================== */
function load(){
  const { name } = sheetName(offset);
  document.getElementById("month").textContent = name;
  const cb = "cb_" + Math.random().toString(36).slice(2);
  const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
              "/gviz/tq?sheet=" + encodeURIComponent(name) +
              "&headers=0&tqx=out:json;responseHandler:" + cb +
              "&_=" + Date.now();

  const fail = setTimeout(() => showError(name), 12000);

  window[cb] = data => {
    clearTimeout(fail);
    try { render(data, name); }
    catch(e){ console.error(e); showError(name, e.message); }
    delete window[cb];
  };

  const s = document.createElement("script");
  s.src = url;
  s.onerror = () => { clearTimeout(fail); showError(name); };
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 15000);
}

function showError(name, msg){
  document.getElementById("status").textContent = "Данные не загрузились";
  document.getElementById("app").innerHTML =
    '<div class="err"><b>Вкладка «' + name + '» не отдаёт данные.</b><br>' +
    'Проверь: в таблице «План продаж» → Файл → Опубликовать в интернете → выбрать вкладку <code>' + name + '</code> → Опубликовать. ' +
    'Каждую новую вкладку нужно публиковать отдельно.' +
    (msg ? '<br><br>Техническая деталь: ' + msg : '') + '</div>';
}

/* ================== ПАРСИНГ ================== */
function parse(data){
  const rows = data.table.rows.map(r => (r.c || []).map(c => c ? c.v : null));

  // gviz иногда забирает верхние строки листа в подписи колонок — возвращаем их как обычные строки
  const labels = (data.table.cols || []).map(c => c && c.label ? String(c.label).trim() : "");
  if (labels.some(l => l && !/^[A-Z]{1,2}$/.test(l))){
    const parts = labels.map(l => l.split(/\s{2,}|\n/).filter(Boolean));
    const depth = parts.reduce((m,p) => Math.max(m, p.length), 0);
    for (let k = depth - 1; k >= 0; k--) rows.unshift(parts.map(p => p[k] || null));
  }

  const cell = (r,i) => (r && i < r.length) ? r[i] : null;

  // строки дней: в первой колонке число 1..31 и есть числовые данные
  const days = [];
  let firstDayIdx = -1;
  rows.forEach((r,idx) => {
    const d = num(cell(r,0));
    const filled = r.slice(1).filter(v => num(v) !== null).length;
    if (d !== null && Number.isInteger(d) && d >= 1 && d <= 31 && filled >= 2){
      if (firstDayIdx < 0) firstDayIdx = idx;
      days.push({ day:d, row:r });
    }
  });
  if (!days.length) throw new Error("не найдены строки с днями месяца. Первые строки листа: " +
    rows.slice(0,3).map(r => r.slice(0,6).map(v => txt(v) || "·").join(" | ")).join("  //  "));

  // последняя заполненная колонка — по строкам дней
  let lastCol = 0;
  days.forEach(({row}) => row.forEach((v,i) => { if (v !== null && v !== "") lastCol = Math.max(lastCol, i); }));

  // строка месячных итогов («Дата»): последняя строка перед днями с числами
  let totalsRow = null;
  for (let i = firstDayIdx - 1; i >= 0; i--){
    if (rows[i].slice(1).filter(v => num(v) !== null).length >= 3){ totalsRow = rows[i]; break; }
  }

  // строка названий точек: «ТОчки» или верхняя строка с текстом
  let namesRow = rows.slice(0, firstDayIdx < 0 ? 6 : firstDayIdx)
    .find(r => /^т\s*очки|^точки/i.test(txt(cell(r,0))) &&
               r.slice(1).filter(v => /^(план|факт)$/i.test(txt(v))).length < 2) || null;
  if (!namesRow){
    namesRow = rows.slice(0, firstDayIdx < 0 ? 6 : firstDayIdx).find(r =>
      r.slice(1).filter(v => txt(v) && num(v) === null && !/план|факт|выполнен|общий|итого/i.test(txt(v))).length >= 2) || null;
  }
  const nameAt = i => {
    const trio = [cell(namesRow,i), cell(namesRow,i+1), cell(namesRow,i+2)]
      .map(v => txt(v).replace(/^\\?\[merged\\?\]\s*/i,"")).filter(Boolean);
    return trio[0] || null;
  };

  // колонки идут тройками: план / факт / % выполнения
  const trios = [];
  for (let i = 1; i + 2 <= lastCol; i += 3){
    const used = days.some(({row}) => num(cell(row,i)) !== null || num(cell(row,i+1)) !== null);
    if (used) trios.push(i);
  }
  if (!trios.length) throw new Error("не удалось разобрать колонки плана и факта");

  // последняя тройка — «ОБЩИЙ», если её план совпадает с суммой остальных
  let totalIdx = null;
  if (trios.length > 1){
    const last = trios[trios.length - 1];
    const sumRow = totalsRow || days[0].row;
    const rest = trios.slice(0,-1).reduce((a,i) => a + (num(cell(sumRow,i)) || 0), 0);
    const lastPlan = num(cell(sumRow,last)) || 0;
    if (rest && Math.abs(lastPlan - rest) / rest < 0.02){ totalIdx = last; trios.pop(); }
  }

  const stores = trios.map((i,k) => ({
    i,
    name: nameAt(i) || STORE_NAMES[k] || ("Точка " + (k+1))
  }));

  // месячные план/факт: строка «Дата», иначе сумма по дням
  const colSum = i => days.reduce((a,{row}) => a + (num(cell(row,i)) || 0), 0);
  for (const s of stores){
    s.plan = totalsRow ? num(cell(totalsRow, s.i)) : null;
    s.fact = totalsRow ? num(cell(totalsRow, s.i+1)) : null;
    if (s.plan === null) s.plan = colSum(s.i);
    if (s.fact === null) s.fact = colSum(s.i+1);
  }

  let plan = (totalsRow && totalIdx !== null) ? num(cell(totalsRow, totalIdx)) : null;
  let fact = (totalsRow && totalIdx !== null) ? num(cell(totalsRow, totalIdx+1)) : null;
  if (!plan) plan = stores.reduce((a,s) => a + s.plan, 0);
  if (!fact) fact = stores.reduce((a,s) => a + s.fact, 0);

  // дневные итоги
  const daily = days.map(({day,row}) => {
    let dp = totalIdx !== null ? num(cell(row,totalIdx)) : null;
    let df = totalIdx !== null ? num(cell(row,totalIdx+1)) : null;
    if (dp === null) dp = stores.reduce((a,s) => a + (num(cell(row,s.i)) || 0), 0);
    if (df === null) df = stores.reduce((a,s) => a + (num(cell(row,s.i+1)) || 0), 0);
    const empty = stores.filter(s => num(cell(row, s.i+1)) === null).map(s => s.name);
    return { day, plan:dp, fact:df, empty };
  });

  return { stores, plan, fact, daily };
}

/* ================== ОТРИСОВКА ================== */
function render(data, name){
  const { stores, plan, fact, daily } = parse(data);
  const { date } = sheetName(offset);
  const now = new Date();
  const isCurrent = date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear();
  const daysInMonth = new Date(date.getFullYear(), date.getMonth()+1, 0).getDate();
  const dayNow = isCurrent ? now.getDate() : daysInMonth;

  const donePct = plan ? fact/plan*100 : 0;
  const timePct = dayNow/daysInMonth*100;
  const left = Math.max(plan - fact, 0);
  const daysLeft = Math.max(daysInMonth - dayNow + 1, 1);
  const perDay = left/daysLeft;
  const ahead = donePct - timePct;

  const app = document.getElementById("app");
  app.innerHTML = `
    <section class="pace">
      <div class="pace-top">
        <div class="metric big">
          <span class="lbl">Факт</span>
          <span class="val">${fmt(Math.round(fact))}</span>
        </div>
        <div class="metric">
          <span class="lbl">План месяца</span>
          <span class="val">${fmt(Math.round(plan))}</span>
        </div>
        <div class="metric">
          <span class="lbl">Осталось</span>
          <span class="val ${left ? "" : "good"}">${fmt(Math.round(left))}</span>
        </div>
        <div class="metric">
          <span class="lbl">Выполнено</span>
          <span class="val" style="color:${pctColor(donePct)}">${donePct.toFixed(0)}%</span>
        </div>
      </div>

      <div class="bar">
        <div class="bar-fill" style="width:${Math.min(donePct,100)}%"></div>
        <div class="marker" style="left:${Math.min(timePct,100)}%" data-lbl="темп ${timePct.toFixed(0)}%"></div>
      </div>

      <div class="pace-note">
        ${isCurrent
          ? `День <b>${dayNow}</b> из ${daysInMonth}. ` + (ahead >= 0
              ? `Идём <b style="color:var(--good)">+${ahead.toFixed(0)} п.п. к темпу</b>. `
              : `Отстаём на <b style="color:var(--bad)">${Math.abs(ahead).toFixed(0)} п.п.</b> `) +
            (left ? `Чтобы закрыть план — <b>${fmt(Math.round(perDay))}</b> в день на все точки.` : `План месяца закрыт.`)
          : `Месяц закрыт: ${donePct.toFixed(0)}% плана.`}
      </div>
    </section>

    <h2>По точкам</h2>
    <div class="grid">
      ${stores.slice().sort((a,b) => (b.fact/(b.plan||1)) - (a.fact/(a.plan||1))).map(s => {
        const p = s.plan ? s.fact/s.plan*100 : 0;
        return `<div class="card">
          <div class="name">${s.name}<span class="pct" style="color:${pctColor(p)}">${p.toFixed(0)}%</span></div>
          <div class="nums"><span>факт <b>${fmt(Math.round(s.fact))}</b></span><span>план ${fmt(Math.round(s.plan))}</span></div>
          <div class="mini"><i style="width:${Math.min(p,100)}%;background:${pctColor(p)}"></i></div>
        </div>`;
      }).join("")}
    </div>

    <h2>Нарастающим итогом</h2>
    <div class="panel">${cumulativeChart(daily, dayNow, isCurrent)}</div>

    <h2>По дням</h2>
    <div class="panel">
      ${dailyChart(daily, dayNow)}
      ${missingNote(daily, dayNow, isCurrent)}
    </div>
  `;

  document.getElementById("status").textContent =
    "Обновлено " + now.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}) + " · вкладка " + name;
}

/* --- график: нарастающий факт против нарастающего плана --- */
function cumulativeChart(daily, dayNow, isCurrent){
  const W=1000,H=280,L=64,R=14,T=14,B=28;
  const rows = daily;
  let cf=0, cp=0;
  const factPts=[], planPts=[];
  rows.forEach(d => {
    cp += d.plan;
    planPts.push({x:d.day, y:cp});
    if (!isCurrent || d.day <= dayNow){ cf += d.fact; factPts.push({x:d.day, y:cf}); }
  });
  const maxY = Math.max(cp, cf, 1);
  const n = rows.length || 31;
  const X = d => L + (d-1)/(n-1)*(W-L-R);
  const Y = v => T + (1 - v/maxY)*(H-T-B);

  const grid=[], labels=[];
  for (let i=0;i<=4;i++){
    const v = maxY*i/4, y = Y(v);
    grid.push(`<line class="gl" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/>`);
    labels.push(`<text class="tick" x="${L-8}" y="${y+3}" text-anchor="end">${fmt(Math.round(v/1000))}k</text>`);
  }
  for (let d=1; d<=n; d+=5)
    labels.push(`<text class="tick" x="${X(d)}" y="${H-8}" text-anchor="middle">${d}</text>`);

  const path = pts => pts.map((p,i) => (i?"L":"M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  const area = factPts.length
    ? `<path d="${path(factPts)} L ${X(factPts[factPts.length-1].x)} ${Y(0)} L ${X(1)} ${Y(0)} Z" fill="url(#g1)"/>` : "";

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Нарастающий факт против плана">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2B138" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#F2B138" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid.join("")}
    <path d="${path(planPts)}" fill="none" stroke="#5AA9E6" stroke-width="2" stroke-dasharray="6 5"/>
    ${area}
    <path d="${path(factPts)}" fill="none" stroke="#F2B138" stroke-width="2.5"/>
    <line class="ax" x1="${L}" y1="${Y(0)}" x2="${W-R}" y2="${Y(0)}"/>
    ${labels.join("")}
    <g font-family="Inter" font-size="11">
      <rect x="${L+10}" y="${T+4}" width="10" height="3" fill="#F2B138"/>
      <text x="${L+26}" y="${T+10}" fill="#E8EDF3">факт</text>
      <rect x="${L+76}" y="${T+4}" width="10" height="3" fill="#5AA9E6"/>
      <text x="${L+92}" y="${T+10}" fill="#E8EDF3">план</text>
    </g>
  </svg>`;
}

/* --- график: столбцы по дням --- */
function dailyChart(daily, dayNow){
  const W=1000,H=220,L=64,R=14,T=14,B=28;
  const n = daily.length || 31;
  const maxY = Math.max(...daily.map(d => Math.max(d.fact, d.plan)), 1);
  const bw = (W-L-R)/n;
  const Y = v => T + (1 - v/maxY)*(H-T-B);

  const bars = daily.map((d,i) => {
    const x = L + i*bw;
    const past = d.day <= dayNow;
    const hit = d.fact >= d.plan;
    const col = !past ? "#212A34" : hit ? "#35C08E" : d.fact ? "#F2B138" : "#3A2226";
    const h = Math.max(Y(0) - Y(d.fact), 0);
    return `<rect x="${(x+bw*0.15).toFixed(1)}" y="${Y(d.fact).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${h.toFixed(1)}" fill="${col}" rx="2">
      <title>${d.day}: факт ${fmt(Math.round(d.fact))} / план ${fmt(Math.round(d.plan))}</title></rect>`;
  }).join("");

  const planLine = daily.map((d,i) => {
    const x1 = L + i*bw + bw*0.15, x2 = x1 + bw*0.7, y = Y(d.plan).toFixed(1);
    return `<line x1="${x1.toFixed(1)}" y1="${y}" x2="${x2.toFixed(1)}" y2="${y}" stroke="#5AA9E6" stroke-width="1.5"/>`;
  }).join("");

  const labels=[];
  for (let i=0;i<=3;i++){
    const v = maxY*i/3, y = Y(v);
    labels.push(`<line class="gl" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/>`);
    labels.push(`<text class="tick" x="${L-8}" y="${y+3}" text-anchor="end">${fmt(Math.round(v/1000))}k</text>`);
  }
  daily.forEach((d,i) => { if (d.day % 5 === 0 || d.day === 1)
    labels.push(`<text class="tick" x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${d.day}</text>`); });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Продажи по дням">
    ${labels.join("")}${bars}${planLine}
    <line class="ax" x1="${L}" y1="${Y(0)}" x2="${W-R}" y2="${Y(0)}"/>
  </svg>`;
}

/* --- кто не отчитался --- */
function missingNote(daily, dayNow, isCurrent){
  if (!isCurrent) return "";
  const y = daily.find(d => d.day === dayNow - 1);
  if (!y || !y.empty.length) return `<div class="missing">За ${dayNow-1} число отчитались все точки.</div>`;
  return `<div class="missing">Нет данных за <b>${dayNow-1}</b> число: ${y.empty.join(", ")}</div>`;
}

/* ================== СОБЫТИЯ ================== */
function refresh(){
  clearTimeout(timer);
  load();
  timer = setTimeout(refresh, REFRESH_MS);
}
document.getElementById("prev").onclick   = () => { offset--; refresh(); };
document.getElementById("next").onclick   = () => { if (offset < 0){ offset++; refresh(); } };
document.getElementById("reload").onclick = refresh;
refresh();
</script>
